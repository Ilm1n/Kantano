name: lighttask_prod

services:
  gateway:
    image: ghcr.io/${IMAGE_REPO_OWNER}/lighttask-frontend:${IMAGE_TAG:-main}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env.gateway
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15.6-alpine3.19
    restart: unless-stopped
    environment:
      POSTGRES_USER: lighttask_user
      POSTGRES_DB: lighttask
      POSTGRES_PASSWORD: ${LIGHTTASK_CONFIG__DB__PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lighttask_user -d lighttask"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres-monitoring-init:
    image: postgres:15.6-alpine3.19
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: lighttask_user
      PGPASSWORD: ${LIGHTTASK_CONFIG__DB__PASSWORD}
      PGDATABASE: lighttask
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD}
    volumes:
      - ./observability/postgres/init-monitoring.sql:/init-monitoring.sql:ro
    command:
      - sh
      - -ec
      - psql --set=ON_ERROR_STOP=1 --set=monitor_password="$$POSTGRES_MONITOR_PASSWORD" --file=/init-monitoring.sql
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-db
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${LIGHTTASK_CONFIG__QUEUE__USER}
      RABBITMQ_DEFAULT_PASS: ${LIGHTTASK_CONFIG__QUEUE__PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${LIGHTTASK_CONFIG__QUEUE__VIRTUAL_HOST:-kantano}
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_data_prod:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 45s
    networks:
      - backend-db
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  jwt-certs-init:
    image: alpine:3.21
    user: "0:0"
    volumes:
      - ./certs:/source:ro
      - jwt_certs_prod:/certs
    command:
      - sh
      - -ec
      - |
        test -f /source/jwt-private.pem
        test -f /source/jwt-public.pem
        cp /source/jwt-private.pem /certs/jwt-private.pem
        cp /source/jwt-public.pem /certs/jwt-public.pem
        chown 10001:10001 /certs/jwt-private.pem /certs/jwt-public.pem
        chmod 600 /certs/jwt-private.pem
        chmod 644 /certs/jwt-public.pem
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/${IMAGE_REPO_OWNER}/lighttask-backend:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file: .env.backend
    volumes:
      - jwt_certs_prod:/app/certs:ro
    environment:
      - LIGHTTASK_CONFIG__DB__HOST=db
      - LIGHTTASK_CONFIG__DB__PORT=5432
      - LIGHTTASK_CONFIG__DB__USER=lighttask_user
      - LIGHTTASK_CONFIG__DB__NAME=lighttask
      - LIGHTTASK_CONFIG__DB__ECHO=0
      - LIGHTTASK_CONFIG__S3__BACKEND=s3
      - LIGHTTASK_CONFIG__RUN__HOST=0.0.0.0
      - LIGHTTASK_CONFIG__RUN__PORT=8000
      - LIGHTTASK_CONFIG__RUN__CORS_ORIGINS=[]
      - LIGHTTASK_CONFIG__INVITE__BASE_URL=https://kantano.ru/invite
      - LIGHTTASK_CONFIG__REALTIME__REDIS_URL=redis://redis:6379/0
      - LIGHTTASK_CONFIG__QUEUE__HOST=rabbitmq
      - LIGHTTASK_SKIP_MIGRATIONS=1
      - LIGHTTASK_CONFIG__OBSERVABILITY__ENVIRONMENT=production
      - LIGHTTASK_CONFIG__OBSERVABILITY__SERVICE_NAME=kantano-api
      - LIGHTTASK_CONFIG__OBSERVABILITY__VERSION=${IMAGE_TAG:-main}
      - LIGHTTASK_CONFIG__OBSERVABILITY__LOG_FORMAT=json
      - LIGHTTASK_CONFIG__OBSERVABILITY__TRACING_ENABLED=true
      - LIGHTTASK_CONFIG__OBSERVABILITY__METRICS_ENABLED=true
      - LIGHTTASK_CONFIG__OBSERVABILITY__OTLP_ENDPOINT=http://alloy:4318/v1/traces
    depends_on:
      jwt-certs-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      alloy:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - frontend-api
      - backend-db
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 400M
    stop_grace_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrations:
    image: ghcr.io/${IMAGE_REPO_OWNER}/lighttask-backend:${IMAGE_TAG:-main}
    command: ["true"]
    env_file: .env.backend
    volumes:
      - jwt_certs_prod:/app/certs:ro
    environment:
      - LIGHTTASK_CONFIG__DB__HOST=db
      - LIGHTTASK_CONFIG__DB__PORT=5432
      - LIGHTTASK_CONFIG__DB__USER=lighttask_user
      - LIGHTTASK_CONFIG__DB__NAME=lighttask
      - LIGHTTASK_CONFIG__S3__BACKEND=s3
    depends_on:
      jwt-certs-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - backend-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery-worker:
    image: ghcr.io/${IMAGE_REPO_OWNER}/lighttask-backend:${IMAGE_TAG:-main}
    restart: unless-stopped
    command: celery --quiet -A src.registration.celery_app worker --pool=solo --without-mingle --without-gossip --without-heartbeat --loglevel=INFO
    env_file: .env.backend
    environment:
      - LIGHTTASK_CONFIG__DB__HOST=db
      - LIGHTTASK_CONFIG__DB__PORT=5432
      - LIGHTTASK_CONFIG__DB__USER=lighttask_user
      - LIGHTTASK_CONFIG__DB__NAME=lighttask
      - LIGHTTASK_CONFIG__QUEUE__HOST=rabbitmq
      - LIGHTTASK_SKIP_MIGRATIONS=1
      - LIGHTTASK_CONFIG__OBSERVABILITY__ENVIRONMENT=production
      - LIGHTTASK_CONFIG__OBSERVABILITY__SERVICE_NAME=kantano-celery-worker
      - LIGHTTASK_CONFIG__OBSERVABILITY__VERSION=${IMAGE_TAG:-main}
      - LIGHTTASK_CONFIG__OBSERVABILITY__LOG_FORMAT=json
      - LIGHTTASK_CONFIG__OBSERVABILITY__TRACING_ENABLED=true
      - LIGHTTASK_CONFIG__OBSERVABILITY__METRICS_ENABLED=true
      - LIGHTTASK_CONFIG__OBSERVABILITY__OTLP_ENDPOINT=http://alloy:4318/v1/traces
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      alloy:
        condition: service_started
    networks:
      - backend-db
    expose:
      - "9101"
    stop_grace_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  outbox-publisher:
    image: ghcr.io/${IMAGE_REPO_OWNER}/lighttask-backend:${IMAGE_TAG:-main}
    restart: unless-stopped
    command: python -m src.registration.outbox_publisher
    env_file: .env.backend
    environment:
      - LIGHTTASK_CONFIG__DB__HOST=db
      - LIGHTTASK_CONFIG__DB__PORT=5432
      - LIGHTTASK_CONFIG__DB__USER=lighttask_user
      - LIGHTTASK_CONFIG__DB__NAME=lighttask
      - LIGHTTASK_CONFIG__QUEUE__HOST=rabbitmq
      - LIGHTTASK_SKIP_MIGRATIONS=1
      - LIGHTTASK_CONFIG__OBSERVABILITY__ENVIRONMENT=production
      - LIGHTTASK_CONFIG__OBSERVABILITY__SERVICE_NAME=kantano-outbox-publisher
      - LIGHTTASK_CONFIG__OBSERVABILITY__VERSION=${IMAGE_TAG:-main}
      - LIGHTTASK_CONFIG__OBSERVABILITY__LOG_FORMAT=json
      - LIGHTTASK_CONFIG__OBSERVABILITY__TRACING_ENABLED=true
      - LIGHTTASK_CONFIG__OBSERVABILITY__METRICS_ENABLED=true
      - LIGHTTASK_CONFIG__OBSERVABILITY__OTLP_ENDPOINT=http://alloy:4318/v1/traces
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      alloy:
        condition: service_started
    networks:
      - backend-db
    expose:
      - "9101"
    stop_grace_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.19.2
    privileged: true
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    env_file: .env.alloy
    environment:
      GOMEMLIMIT: 384MiB
      POSTGRES_MONITOR_DSN: postgresql://kantano_monitor:${POSTGRES_MONITOR_PASSWORD}@db:5432/lighttask?sslmode=disable
    volumes:
      - ./observability/alloy/config.prod.alloy:/etc/alloy/config.alloy:ro
      - alloy_data_prod:/var/lib/alloy/data
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /run/udev/data:/run/udev/data:ro
      - /:/rootfs:ro,rslave
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    depends_on:
      postgres-monitoring-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-db
    expose:
      - "4318"
      - "12345"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend-api:
  backend-db:

volumes:
  postgres_data_prod:
  caddy_data:
  caddy_config:
  jwt_certs_prod:
  rabbitmq_data_prod:
  alloy_data_prod:
