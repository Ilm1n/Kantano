name: lighttask_prod

services:
  gateway:
    image: ghcr.io/${IMAGE_REPO_OWNER}/lighttask-frontend:${IMAGE_TAG:-main}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15.6-alpine3.19
    restart: unless-stopped
    environment:
      POSTGRES_USER: lighttask_user
      POSTGRES_DB: lighttask
      POSTGRES_PASSWORD: ${LIGHTTASK_CONFIG__DB__PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lighttask_user -d lighttask"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-db
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${LIGHTTASK_CONFIG__QUEUE__USER}
      RABBITMQ_DEFAULT_PASS: ${LIGHTTASK_CONFIG__QUEUE__PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${LIGHTTASK_CONFIG__QUEUE__VIRTUAL_HOST:-kantano}
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_data_prod:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 45s
    networks:
      - backend-db
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  jwt-certs-init:
    image: alpine:3.21
    user: "0:0"
    volumes:
      - ./certs:/source:ro
      - jwt_certs_prod:/certs
    command:
      - sh
      - -ec
      - |
        test -f /source/jwt-private.pem
        test -f /source/jwt-public.pem
        cp /source/jwt-private.pem /certs/jwt-private.pem
        cp /source/jwt-public.pem /certs/jwt-public.pem
        chown 10001:10001 /certs/jwt-private.pem /certs/jwt-public.pem
        chmod 600 /certs/jwt-private.pem
        chmod 644 /certs/jwt-public.pem
    restart: "no"

  backend:
    image: ghcr.io/${IMAGE_REPO_OWNER}/lighttask-backend:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file: .env
    volumes:
      - jwt_certs_prod:/app/certs:ro
    environment:
      - LIGHTTASK_CONFIG__DB__HOST=db
      - LIGHTTASK_CONFIG__DB__PORT=5432
      - LIGHTTASK_CONFIG__DB__USER=lighttask_user
      - LIGHTTASK_CONFIG__DB__NAME=lighttask
      - LIGHTTASK_CONFIG__DB__ECHO=0
      - LIGHTTASK_CONFIG__S3__BACKEND=s3
      - LIGHTTASK_CONFIG__RUN__HOST=0.0.0.0
      - LIGHTTASK_CONFIG__RUN__PORT=8000
      - LIGHTTASK_CONFIG__RUN__CORS_ORIGINS=[]
      - LIGHTTASK_CONFIG__INVITE__BASE_URL=https://kantano.ru/invite
      - LIGHTTASK_CONFIG__REALTIME__REDIS_URL=redis://redis:6379/0
      - LIGHTTASK_CONFIG__QUEUE__HOST=rabbitmq
      - LIGHTTASK_SKIP_MIGRATIONS=1
    depends_on:
      jwt-certs-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - frontend-api
      - backend-db
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 400M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrations:
    image: ghcr.io/${IMAGE_REPO_OWNER}/lighttask-backend:${IMAGE_TAG:-main}
    command: ["true"]
    env_file: .env
    volumes:
      - jwt_certs_prod:/app/certs:ro
    environment:
      - LIGHTTASK_CONFIG__DB__HOST=db
      - LIGHTTASK_CONFIG__DB__PORT=5432
      - LIGHTTASK_CONFIG__DB__USER=lighttask_user
      - LIGHTTASK_CONFIG__DB__NAME=lighttask
      - LIGHTTASK_CONFIG__S3__BACKEND=s3
    depends_on:
      jwt-certs-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - backend-db

  celery-worker:
    image: ghcr.io/${IMAGE_REPO_OWNER}/lighttask-backend:${IMAGE_TAG:-main}
    restart: unless-stopped
    command: celery -A src.registration.celery_app worker --pool=solo --without-mingle --without-gossip --without-heartbeat --loglevel=INFO
    env_file: .env
    environment:
      - LIGHTTASK_CONFIG__DB__HOST=db
      - LIGHTTASK_CONFIG__DB__PORT=5432
      - LIGHTTASK_CONFIG__DB__USER=lighttask_user
      - LIGHTTASK_CONFIG__DB__NAME=lighttask
      - LIGHTTASK_CONFIG__QUEUE__HOST=rabbitmq
      - LIGHTTASK_SKIP_MIGRATIONS=1
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - backend-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  outbox-publisher:
    image: ghcr.io/${IMAGE_REPO_OWNER}/lighttask-backend:${IMAGE_TAG:-main}
    restart: unless-stopped
    command: python -m src.registration.outbox_publisher
    env_file: .env
    environment:
      - LIGHTTASK_CONFIG__DB__HOST=db
      - LIGHTTASK_CONFIG__DB__PORT=5432
      - LIGHTTASK_CONFIG__DB__USER=lighttask_user
      - LIGHTTASK_CONFIG__DB__NAME=lighttask
      - LIGHTTASK_CONFIG__QUEUE__HOST=rabbitmq
      - LIGHTTASK_SKIP_MIGRATIONS=1
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - backend-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend-api:
  backend-db:

volumes:
  postgres_data_prod:
  caddy_data:
  caddy_config:
  jwt_certs_prod:
  rabbitmq_data_prod:
