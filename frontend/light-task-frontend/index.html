<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <title>Kantano — бесплатная канбан-доска для задач и учёбы</title>
    <meta
      name="description"
      content="Планируйте личные дела, учёбу и фриланс в Kantano. Канбан-доски, сроки, приоритеты и совместные проекты — бесплатно в браузере"
    />
    <link rel="canonical" href="https://kantano.ru/" />
    <link rel="describedby" href="/llms.txt" type="text/plain" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kantano.ru/" />
    <meta
      property="og:title"
      content="Kantano — свои задачи в понятном порядке"
    />
    <meta
      property="og:description"
      content="Бесплатная канбан-доска для личных дел, учёбы и совместных проектов."
    />
    <meta property="og:image" content="https://kantano.ru/og-image.png" />
    <meta property="og:image:alt" content="Доска учебного проекта в Kantano" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Kantano",
            "url": "https://kantano.ru/",
            "inLanguage": "ru"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Kantano",
            "url": "https://kantano.ru/",
            "applicationCategory": "ProductivityApplication",
            "operatingSystem": "Web",
            "description": "Канбан-доска для личных дел, учёбы и совместных проектов"
          }
        ]
      }
    </script>
    <script>
      (function () {
        const storageTheme = localStorage.getItem("theme");
        const systemDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const isDark = storageTheme === "dark" || (!storageTheme && systemDark);
        if (isDark) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = "#0f172a";
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.backgroundColor = "#f8f9fa";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"><!--landing-html--></div>
    <script type="module" src="/src/modules/landing/client.ts"></script>
  </body>
</html>
