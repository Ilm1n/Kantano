name: Deploy to Production

on:
  # push:
  #   branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
      image_repo_owner: ${{ steps.vars.outputs.image_repo_owner }}
    steps:
      - uses: actions/checkout@v5
      - name: Get image metadata
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_repo_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build-backend:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend/light_task
          push: true
          pull: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo_owner }}/lighttask-backend:main
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo_owner }}/lighttask-backend:${{ needs.prepare.outputs.sha_short }}

  build-frontend:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend/light-task-frontend
          file: ./frontend/light-task-frontend/Dockerfile
          push: true
          pull: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo_owner }}/lighttask-frontend:main
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo_owner }}/lighttask-frontend:${{ needs.prepare.outputs.sha_short }}

  deploy:
    runs-on: ubuntu-latest
    needs: [prepare, build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Create config and certs
        env:
          TAG: ${{ needs.prepare.outputs.sha_short }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          S3_ACCESS: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME }}
          BACKUP_S3_ACCESS: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET_NAME }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          BACKUP_PINGZEN_URL: ${{ secrets.BACKUP_PINGZEN_URL }}
          OWNER: ${{ needs.prepare.outputs.image_repo_owner }}
          JWT_PRIVATE: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC: ${{ secrets.JWT_PUBLIC_KEY }}
          SWAGGER_HASH: ${{ secrets.SWAGGER_HASH }}
          YANDEX_CLIENT_ID: ${{ vars.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          YANDEX_REDIRECT_URI: ${{ vars.YANDEX_REDIRECT_URI }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ vars.RESEND_FROM_NAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          cat <<EOF > .env.prod
          LIGHTTASK_CONFIG__DB__PASSWORD=$DB_PASSWORD
          LIGHTTASK_CONFIG__S3__BACKEND=s3
          LIGHTTASK_CONFIG__S3__ACCESS_KEY=$S3_ACCESS
          LIGHTTASK_CONFIG__S3__SECRET_KEY=$S3_SECRET
          LIGHTTASK_CONFIG__S3__BUCKET_NAME=$S3_BUCKET
          LIGHTTASK_CONFIG__YANDEX__CLIENT_ID=$YANDEX_CLIENT_ID
          LIGHTTASK_CONFIG__YANDEX__CLIENT_SECRET=$YANDEX_CLIENT_SECRET
          LIGHTTASK_CONFIG__YANDEX__REDIRECT_URI=$YANDEX_REDIRECT_URI
          LIGHTTASK_CONFIG__FRONTEND__BASE_URL=$FRONTEND_BASE_URL
          LIGHTTASK_CONFIG__EMAIL__PROVIDER=resend
          LIGHTTASK_CONFIG__RESEND__API_KEY=$RESEND_API_KEY
          LIGHTTASK_CONFIG__RESEND__BASE_URL=https://api.resend.com
          LIGHTTASK_CONFIG__RESEND__FROM_EMAIL=$RESEND_FROM_EMAIL
          LIGHTTASK_CONFIG__RESEND__FROM_NAME=$RESEND_FROM_NAME
          LIGHTTASK_CONFIG__QUEUE__USER=lighttask
          LIGHTTASK_CONFIG__QUEUE__PASSWORD=$RABBITMQ_PASSWORD
          LIGHTTASK_CONFIG__QUEUE__VIRTUAL_HOST=kantano
          IMAGE_REPO_OWNER=$OWNER
          IMAGE_TAG=$TAG
          SWAGGER_HASH='$SWAGGER_HASH'
          EOF

          cat <<EOF > .env.backup
          AWS_ACCESS_KEY_ID=$BACKUP_S3_ACCESS
          AWS_SECRET_ACCESS_KEY=$BACKUP_S3_SECRET
          AWS_DEFAULT_REGION=ru1
          RESTIC_REPOSITORY=s3:https://s3.ru1.storage.beget.cloud/$BACKUP_S3_BUCKET/kantano-db
          RESTIC_PASSWORD=$RESTIC_PASSWORD
          BACKUP_PINGZEN_URL=$BACKUP_PINGZEN_URL
          EOF
          
          mkdir -p certs
          printf "%s" "$JWT_PRIVATE" > certs/jwt-private.pem
          printf "%s" "$JWT_PUBLIC" > certs/jwt-public.pem

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "docker-compose.prod.yml,.env.prod,.env.backup,Caddyfile,rabbitmq.conf,certs/,scripts/backup-db.sh"
          target: "/home/${{ secrets.VPS_USER }}/app"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          envs: GITHUB_TOKEN,ACTOR
          script: |
            set -e

            retry() {
              attempts="$1"
              delay="$2"
              shift 2
              run_number=1

              until "$@"; do
                if [ "$run_number" -ge "$attempts" ]; then
                  return 1
                fi

                echo "Attempt ${run_number}/${attempts} failed. Retrying in ${delay}s..."
                run_number=$((run_number + 1))
                sleep "$delay"
              done
            }

            docker_login_ghcr() {
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            }

            pull_images() {
              docker compose -f docker-compose.prod.yml pull
            }

            cd ~/app
            if [ -f .env.prod ]; then mv .env.prod .env; fi
            chmod 600 certs/*.pem .env.backup
            chmod 700 scripts/backup-db.sh

            retry 5 10 docker_login_ghcr
            retry 5 15 pull_images
            retry 5 15 docker pull restic/restic:0.19.1

            if ! docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans --wait --wait-timeout 180; then
              docker compose -f docker-compose.prod.yml ps --all
              docker compose -f docker-compose.prod.yml logs --tail=200 migrations rabbitmq backend celery-worker outbox-publisher
              exit 1
            fi

            run_restic() {
              docker run --rm --env-file .env.backup restic/restic:0.19.1 "$@"
            }

            if ! run_restic cat config >/dev/null 2>&1; then
              run_restic init
            fi

            if ! command -v crontab >/dev/null || ! command -v logger >/dev/null; then
              echo "cron and logger must be installed on the VPS to schedule database backups." >&2
              exit 1
            fi

            if ! systemctl is-active --quiet cron && ! systemctl is-active --quiet crond; then
              echo "The cron service is not active on the VPS." >&2
              exit 1
            fi

            server_timezone="$(timedatectl show --property=Timezone --value 2>/dev/null || cat /etc/timezone)"
            case "$server_timezone" in
              UTC|Etc/UTC)
                backup_cron_time="15 0"
                ;;
              Europe/Moscow)
                backup_cron_time="15 3"
                ;;
              *)
                echo "Unsupported server timezone for the database backup schedule: $server_timezone" >&2
                exit 1
                ;;
            esac

            cron_marker="# kantano-db-backup"
            app_dir="$(pwd)"
            cron_entry="$backup_cron_time * * * $app_dir/scripts/backup-db.sh 2>&1 | /usr/bin/logger -t kantano-backup $cron_marker"
            (crontab -l 2>/dev/null | grep -Fv "$cron_marker" || true; printf '%s\n' "$cron_entry") | crontab -

            docker image prune -af --filter "until=24h"
            retry 5 15 docker pull restic/restic:0.19.1

  cleanup:
    name: Cleanup Registry
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete Old Backend Images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'lighttask-backend'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'false'

      - name: Delete Old Frontend Images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'lighttask-frontend'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'false'
