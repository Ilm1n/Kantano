name: Backend Tests

on:
  push:
    branches: ["main"]
    paths:
      - "backend/light_task/**"
      - ".github/workflows/backend-tests.yml"
      - "docker-compose.test.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/light_task/**"
      - ".github/workflows/backend-tests.yml"
      - "docker-compose.test.yml"
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lighttask_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lighttask_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: lighttask
          RABBITMQ_DEFAULT_PASS: lighttask-test
          RABBITMQ_DEFAULT_VHOST: kantano
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend/light_task

    env:
      LIGHTTASK_CONFIG__DB__HOST: 127.0.0.1
      LIGHTTASK_CONFIG__DB__PORT: "5432"
      LIGHTTASK_CONFIG__DB__USER: postgres
      LIGHTTASK_CONFIG__DB__PASSWORD: postgres
      LIGHTTASK_CONFIG__DB__NAME: lighttask_test
      LIGHTTASK_CONFIG__S3__ACCESS_KEY: test
      LIGHTTASK_CONFIG__S3__SECRET_KEY: test
      LIGHTTASK_CONFIG__S3__BUCKET_NAME: test
      LIGHTTASK_CONFIG__AUTH_JWT__SECURE: "False"
      LIGHTTASK_CONFIG__REALTIME__REDIS_URL: redis://127.0.0.1:6379/15
      LIGHTTASK_CONFIG__REALTIME__PRESENCE_TTL_SECONDS: "2"
      LIGHTTASK_CONFIG__REALTIME__PRESENCE_SYNC_INTERVAL_SECONDS: "1"
      LIGHTTASK_CONFIG__QUEUE__HOST: 127.0.0.1
      LIGHTTASK_CONFIG__QUEUE__PORT: "5672"
      LIGHTTASK_CONFIG__QUEUE__USER: lighttask
      LIGHTTASK_CONFIG__QUEUE__PASSWORD: lighttask-test
      LIGHTTASK_CONFIG__QUEUE__VIRTUAL_HOST: kantano

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync Dependencies
        run: uv sync --group dev

      - name: Run Ruff Linter Check
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Run Type Checking (Basedpyright)
        run: uv run basedpyright

      - name: Run Migrations
        run: uv run alembic upgrade head

      - name: Run Backend Tests
        run: uv run pytest -q
