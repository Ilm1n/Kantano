name: lighttask_dev

services:
  fake-email:
    image: python:3.12-alpine
    command: ["python", "/work/server.py"]
    volumes:
      - ./observability/fake-email/server.py:/work/server.py:ro
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery-worker:
    environment:
      LIGHTTASK_CONFIG__RESEND__BASE_URL: http://fake-email:8080
      LIGHTTASK_CONFIG__RESEND__API_KEY: local-observability-verification
    depends_on:
      fake-email:
        condition: service_healthy
