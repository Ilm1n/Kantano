name: lighttask_dev

services:
  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${LIGHTTASK_CONFIG__QUEUE__USER:-lighttask}
      RABBITMQ_DEFAULT_PASS: ${LIGHTTASK_CONFIG__QUEUE__PASSWORD:-lighttask-dev}
      RABBITMQ_DEFAULT_VHOST: ${LIGHTTASK_CONFIG__QUEUE__VIRTUAL_HOST:-kantano}
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_data_dev:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${LIGHTTASK_CONFIG__DB__USER}
      POSTGRES_PASSWORD: ${LIGHTTASK_CONFIG__DB__PASSWORD}
      POSTGRES_DB: ${LIGHTTASK_CONFIG__DB__NAME}
    ports:
      - "${LIGHTTASK_CONFIG__DB__PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LIGHTTASK_CONFIG__DB__USER} -d ${LIGHTTASK_CONFIG__DB__NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  local-storage-init:
    image: alpine:3.21
    user: "0:0"
    volumes:
      - local_storage_dev:/storage
    command:
      - sh
      - -ec
      - |
        mkdir -p /storage/avatar-storage
        chown -R 10001:10001 /storage
        chmod -R u+rwX,go-rwx /storage
    restart: "no"

  jwt-certs-init:
    image: alpine:3.21
    user: "0:0"
    volumes:
      - ./backend/light_task/certs:/source:ro
      - jwt_certs_dev:/certs
    command:
      - sh
      - -ec
      - |
        test -f /source/jwt-private.pem
        test -f /source/jwt-public.pem
        cp /source/jwt-private.pem /certs/jwt-private.pem
        cp /source/jwt-public.pem /certs/jwt-public.pem
        chown 10001:10001 /certs/jwt-private.pem /certs/jwt-public.pem
        chmod 600 /certs/jwt-private.pem
        chmod 644 /certs/jwt-public.pem
    restart: "no"

  backend:
    build:
      context: ./backend/light_task
      dockerfile: Dockerfile
    command: uvicorn src.main:main_app --host ${LIGHTTASK_CONFIG__RUN__HOST:-0.0.0.0} --port ${LIGHTTASK_CONFIG__RUN__PORT:-8000} --reload
    volumes:
      - ./backend/light_task/src:/app/src
      - ./backend/light_task/alembic:/app/alembic
      - jwt_certs_dev:/app/certs:ro
      - local_storage_dev:/app/.local
    ports:
      - "${LIGHTTASK_CONFIG__RUN__PORT:-8000}:${LIGHTTASK_CONFIG__RUN__PORT:-8000}"
    env_file:
      - .env
    environment:
      - LIGHTTASK_CONFIG__DB__HOST=db
      - LIGHTTASK_CONFIG__REALTIME__REDIS_URL=redis://redis:6379/0
      - LIGHTTASK_CONFIG__QUEUE__HOST=rabbitmq
      - LIGHTTASK_SKIP_MIGRATIONS=1
    depends_on:
      local-storage-init:
        condition: service_completed_successfully
      jwt-certs-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
  migrations:
    build: ./backend/light_task
    command: ["true"]
    env_file: .env
    environment:
      - LIGHTTASK_CONFIG__DB__HOST=db
    depends_on:
      db:
        condition: service_healthy
  celery-worker:
    build: ./backend/light_task
    command: celery -A src.registration.celery_app worker --pool=solo --without-mingle --without-gossip --without-heartbeat --loglevel=INFO
    env_file: .env
    environment:
      - LIGHTTASK_CONFIG__DB__HOST=db
      - LIGHTTASK_CONFIG__QUEUE__HOST=rabbitmq
      - LIGHTTASK_SKIP_MIGRATIONS=1
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
  outbox-publisher:
    build: ./backend/light_task
    command: python -m src.registration.outbox_publisher
    env_file: .env
    environment:
      - LIGHTTASK_CONFIG__DB__HOST=db
      - LIGHTTASK_CONFIG__QUEUE__HOST=rabbitmq
      - LIGHTTASK_SKIP_MIGRATIONS=1
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

volumes:
  postgres_data_dev:
  local_storage_dev:
  jwt_certs_dev:
  rabbitmq_data_dev:
