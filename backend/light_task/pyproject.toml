[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the Kantano task manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.17.0",
    "asyncpg>=0.30.0",
    "celery>=5.6.0",
    "fastapi[standard]>=0.118.0",
    "filetype>=1.2.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "orjson>=3.11.4",
    "pip>=25.3",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.11.0",
    "pydantic[email]>=2.11.10",
    "pyjwt[crypto]>=2.10.1",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.44",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    "pre-commit>=4.6.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.20",
]


[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "alembic",  # Полностью исключаем генерации Alembic из проверок
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "S",      # flake8-bandit (безопасность)
    "ASYNC",  # flake8-async
    "T20",    # flake8-print (запрет принтов)
    "RUF",    # Собственные правила Ruff
]

ignore = [
    "E501",   # Игнорируем длину строки (доверяем форматировщику)
]

# Пофайловые исключения:
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"scripts/**/*.py" = ["T201"]
"src/**/schemas.py" = ["S105"]
"src/errors.py" = ["S105"]

fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "basic"
